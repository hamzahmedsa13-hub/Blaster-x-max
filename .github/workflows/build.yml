name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip3 install --upgrade buildozer cython==0.29.33 virtualenv

      - name: Build APK
        run: |
          buildozer init
          sed -i 's/title = My Application/title = Blastar VIP/g' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,pygame/g' buildozer.spec
          sed -i 's/orientation = landscape/orientation = portrait/g' buildozer.spec
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Blastar-Game-APK
          path: bin/*.apk

